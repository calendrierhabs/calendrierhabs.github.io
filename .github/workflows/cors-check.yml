name: CORS check (temporary)
on:
  push:
    branches: [claude/cors-check]
permissions:
  contents: write
jobs:
  check:
    if: "!contains(github.event.head_commit.message, 'probe done')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: |
          mkdir -p probe && cd tools && npm init -y >/dev/null && npm i playwright@1.47.2 >/dev/null 2>&1 && cd .. && cp tools/probe.mjs tools/p.mjs && node tools/p.mjs || echo "probe crashed $?" >> probe/log.txt
          git config user.name bot && git config user.email bot@example.com
          git add probe && git commit -m "probe done" && git push
