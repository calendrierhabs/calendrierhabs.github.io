name: CORS check (temporary)
on:
  push:
    branches: [claude/cors-check]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for t in MTL SJS BOS CHI WPG STL DAL PIT BUF WSH CAR NSH DET TBL OTT TOR FLA; do
            echo "LOGO $t $(curl -s https://assets.nhle.com/logos/nhl/svg/${t}_light.svg | gzip -9 | base64 -w0)"
          done
