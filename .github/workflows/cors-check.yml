name: CORS check (temporary)
on:
  push:
    branches: [claude/cors-check]
permissions:
  contents: write
jobs:
  check:
    if: "!contains(github.event.head_commit.message, 'darklogos done')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: |
          mkdir -p darklogos && for t in ANA BOS BUF CGY CAR CHI COL CBJ DAL DET EDM FLA LAK MIN MTL NSH NJD NYI NYR OTT PHI PIT SJS SEA STL TBL TOR UTA VAN VGK WSH WPG; do curl -s -o darklogos/${t}_dark.svg https://assets.nhle.com/logos/nhl/svg/${t}_dark.svg; done
          git config user.name bot && git config user.email bot@example.com
          git add probe && git commit -m "darklogos done" && git push
