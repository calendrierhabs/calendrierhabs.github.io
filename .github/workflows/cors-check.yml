name: CORS check (temporary)
on:
  push:
    branches: [claude/cors-check]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -s "https://site.api.espn.com/apis/site/v2/sports/hockey/nhl/scoreboard?dates=20261020" > sb.json
          jq -c '[.events[] | {id, date, name, shortName, status, comps: [.competitions[0].competitors[] | {homeAway, score, abbr: .team.abbreviation, linescores}], sit: .competitions[0].situation, bc: .competitions[0].broadcasts}] | map(select(.shortName|test("MTL")))' sb.json
          echo "== all abbrs"
          jq -c '[.events[].competitions[0].competitors[].team.abbreviation]' sb.json
          echo "== today"
          curl -s "https://site.api.espn.com/apis/site/v2/sports/hockey/nhl/scoreboard" | jq -c '[.events[] | {shortName, st: .status.type.name, detail: .status.type.detail, clock: .status.displayClock, period: .status.period}] | .[0:4]'
