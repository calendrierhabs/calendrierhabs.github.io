# Keeps the calendar up to date on its own: every 10 minutes it pulls fresh
# schedule, scores, standings and stats from the NHL and republishes the site.
name: Update data and publish

on:
  schedule:
    - cron: "3-59/10 * * * *"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update-and-publish
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch NHL data
        run: node scripts/update-data.mjs

      # Saving the data also counts as repo activity, which stops GitHub from
      # pausing the schedule after 60 quiet days (e.g. in the summer).
      - name: Save data when it changed
        run: |
          git config user.name "habs-calendar-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data/habs.json
          last=$(git log -1 --format=%ct)
          now=$(date +%s)
          if ! git diff --cached --quiet; then
            git commit -m "Update NHL data"
          elif [ $((now - last)) -gt $((30 * 86400)) ]; then
            git commit --allow-empty -m "Keep automatic updates switched on"
          else
            exit 0
          fi
          git push || (git pull --rebase && git push)

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4
