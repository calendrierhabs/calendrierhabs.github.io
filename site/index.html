<!doctype html>
<html lang="fr" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Habs</title>
<meta name="description" content="Le calendrier des Canadiens de Montréal : matchs, chaînes télé, classement et équipe.">
<meta name="theme-color" content="#13194A">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preload" href="fonts/barlow-condensed-latin-700-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/barlow-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="css/fonts.css">
<link rel="stylesheet" href="css/app.css">
<link rel="stylesheet" href="css/reminders.css">
<script>
  // Apply the saved theme before the page paints, so it never flashes.
  try {
    var t = localStorage.getItem("habs.theme");
    if (!t) t = matchMedia("(prefers-color-scheme: dark)").matches ? "rouge" : "light";
    document.documentElement.dataset.theme = t;
  } catch (e) {}
</script>
</head>
<body>
<div id="app" class="shell"></div>
<noscript>Activez JavaScript pour voir le calendrier. / Turn on JavaScript to see the calendar.</noscript>
<script type="module" src="js/app.js"></script>
</body>
</html>
